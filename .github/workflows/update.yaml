name: Auto Update PhotoCraft

"on":
  workflow_dispatch:
  schedule:
    # 19:00 UTC = 03:00 the next day in Asia/Kuala_Lumpur.
    - cron: "0 19 * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      changed: ${{ steps.release.outputs.changed }}
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: szcq
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Check for a new release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(gh api repos/storytold/photocraft/releases/latest --jq '.tag_name | ltrimstr("v")')
          printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'
          echo "version=$version" >> "$GITHUB_OUTPUT"
          image="docker.io/szcq/photocraft:$version"
          inspect_error="$RUNNER_TEMP/photocraft-manifest-error.log"
          if docker buildx imagetools inspect "$image" > /dev/null 2> "$inspect_error"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "PhotoCraft $version is already published; skipping build."
          elif grep -Fq "$image: not found" "$inspect_error" || grep -Fq 'manifest unknown' "$inspect_error"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "PhotoCraft $version has not been published; building image."
          else
            cat "$inspect_error" >&2
            exit 1
          fi
  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/docker.yaml
    with:
      version: ${{ needs.check.outputs.version }}
    secrets: inherit
